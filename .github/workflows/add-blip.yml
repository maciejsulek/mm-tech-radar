name: Add blip from approved proposal

# Runs when a maintainer adds the "approved" label to a proposal issue.
# Several approvals can run at the same time: each one saves its change on top of the
# latest data (retrying if another approval saved first), then asks for a publish.
# Publishing is queued, so approving many proposals in a row publishes only once or twice.
on:
  issues:
    types: [labeled]

jobs:
  add-blip:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Update radar data and save it
        id: apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RESULT="$RUNNER_TEMP/radar-result.txt"
          value() { grep -A1 "^$1<<" "$RESULT" | tail -n1; }
          SAVED=""
          for attempt in 1 2 3 4 5 6; do
            # Start from the latest saved data every time.
            git fetch --quiet origin "$BRANCH"
            git reset --quiet --hard "origin/$BRANCH"
            : > "$RESULT"
            GITHUB_OUTPUT="$RESULT" node scripts/radar.mjs add-from-issue
            [ "$(value ok)" = "true" ] || break          # a problem with the proposal: report it, nothing to save
            git add site/data site/images notes
            if git diff --cached --quiet; then SAVED=yes; break; fi
            git commit --quiet -m "Radar: $(value name) (#$ISSUE)"
            if git push --quiet origin "HEAD:$BRANCH"; then SAVED=yes; break; fi
            echo "Another change was saved at the same moment; trying again ($attempt)..."
            sleep $(( attempt * 4 ))
          done
          cat "$RESULT" >> "$GITHUB_OUTPUT"
          if [ "$(value ok)" = "true" ] && [ -z "$SAVED" ]; then
            echo "Could not save the change after several attempts." >&2
            exit 1
          fi

      - name: Request a publish
        if: steps.apply.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Report success on the issue
        if: steps.apply.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          MESSAGE: ${{ steps.apply.outputs.message }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report a problem on the issue
        if: failure() || steps.apply.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          MESSAGE: ${{ steps.apply.outputs.message }}
          OK: ${{ steps.apply.outputs.ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OK" = "true" ] || [ -z "$MESSAGE" ]; then
            MESSAGE="Something went wrong while adding this to the radar. The details are in the workflow run: $RUN_URL"
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label approved || true
