name: Start a new radar edition

# Run from the Actions tab. Resets every blip to "No change" so only the next round of
# proposals shows as New or Moved, and sets the edition name shown in the radar header.
on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition name, for example "May 2027"
        required: true

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Reset statuses
        env:
          EDITION: ${{ inputs.edition }}
        run: node scripts/radar.mjs new-edition "$EDITION"
      - name: Commit
        env:
          EDITION: ${{ inputs.edition }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data notes
          git commit -m "Radar: start edition $EDITION"
          git push

  deploy:
    needs: reset
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
